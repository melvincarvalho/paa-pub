name = "paa-pub"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
PAA_USERNAME = "admin"
# PAA_PASSWORD set via `wrangler secret put PAA_PASSWORD`
# PAA_DOMAIN set via `wrangler secret put PAA_DOMAIN` or vars
# PAA_STORAGE_LIMIT set here or via secret (default 1GB)
# PAA_FEED_LIMIT set here or via secret (default 50)

[assets]
directory = "./public"

[[kv_namespaces]]
binding = "TRIPLESTORE"
id = "371b47cb3eaf48b082975ffec4d10c18"

[[kv_namespaces]]
binding = "APPDATA"
id = "e2f43635ca294cd2aff29a2ed2da08c3"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "paa-pub-blobs"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
